<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pagina non trovata — A.mici per la vita Brescia ODV</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/assets/logo-icona.svg">
<link rel="icon" type="image/jpeg" href="/assets/logo-icona.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito+Sans:wght@400;600&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
:root{--crema:#F7F1E4;--panna:#FDFAF4;--salvia:#6B7A52;--salvia-scuro:#4E5A3B;
  --rosa:#C4838D;--rosa-scuro:#A96872;--inchiostro:#22314A;--ambra:#F0B45E;
  --display:'Baloo 2',system-ui,sans-serif;--testo:'Nunito Sans',system-ui,sans-serif;--mano:'Caveat',cursive}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:var(--crema);color:var(--inchiostro);font-family:var(--testo);font-size:17px;
  line-height:1.65;-webkit-font-smoothing:antialiased;padding:32px 22px;text-align:center}
img,svg{display:block;max-width:100%}
.scatola{max-width:520px}
.marchio{display:inline-block;background:var(--panna);border-radius:24px;padding:14px 20px;
  box-shadow:0 3px 0 rgba(34,49,74,.07);margin-bottom:26px}
.marchio img{width:190px;height:auto}
.mano{font-family:var(--mano);font-size:1.5rem;color:var(--rosa-scuro);margin:0}
h1{font-family:var(--display);font-weight:800;font-size:clamp(1.8rem,5vw,2.6rem);
  line-height:1.1;margin:.2em 0 .5em;letter-spacing:-.01em}
p{margin:0 0 1.3em;color:#3a4a63}
.btn{display:inline-block;background:var(--rosa);color:#fff;font-family:var(--testo);
  font-weight:700;line-height:1.2;padding:13px 26px;border-radius:999px;text-decoration:none;
  box-shadow:0 6px 0 var(--rosa-scuro);transition:transform .15s ease}
.btn:hover{transform:translateY(2px);box-shadow:0 4px 0 var(--rosa-scuro)}
.zampa{width:46px;margin:0 auto 18px;color:var(--salvia)}
:focus-visible{outline:3px solid var(--ambra);outline-offset:3px;border-radius:6px}
</style>
</head>
<body>
<div class="scatola">
  <span class="marchio">
    <img src="/assets/logo-completo.svg" width="1080" height="682" alt="A.mici per la vita — La Casa Felina">
  </span>
  <svg class="zampa" viewBox="0 0 40 40" aria-hidden="true">
    <g fill="currentColor">
      <ellipse cx="20" cy="27" rx="11" ry="9"/>
      <ellipse cx="7" cy="16" rx="4.4" ry="5.6"/>
      <ellipse cx="16" cy="10" rx="4.4" ry="6"/>
      <ellipse cx="26" cy="10" rx="4.4" ry="6"/>
      <ellipse cx="34" cy="16" rx="4.4" ry="5.6"/>
    </g>
  </svg>
  <p class="mano">Qui non c’è nessuno</p>
  <h1>Questa pagina è andata a farsi un giro.</h1>
  <p>Deve aver seguito un gatto. Torna all’inizio: lì ci sono tutti i nostri contatti.</p>
  <a class="btn" href="/">Torna alla home</a>
</div>
</body>
</html>
